# 工作流的名字
name: Build Device Watch APK

# 触发条件
on:
  push:
    branches: [ "main", "master", "patch-1" ]  # 这几个分支有新提交就触发
  workflow_dispatch:  # 允许你手动点击按钮触发

# 工作流的具体任务
jobs:
  build:
    # 微软提供的云端服务器环境
    runs-on: ubuntu-latest
    
    # 步骤列表
    steps:
    # 第一步：拉取你的代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 第二步：安装 Java 17（安卓打包必备）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 第三步：给打包脚本赋予执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 第四步：开始打包
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 第五步：把打包好的 APK 传上来给你下载
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Device-Watch-APK
        path: app/build/outputs/apk/debug/*.apk
